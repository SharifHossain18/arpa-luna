<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arpa Memories Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #fff; padding: 1rem; }
        h1 { text-align: center; margin-bottom: 1rem; font-size: 1.5rem; }
        .controls { text-align: center; margin-bottom: 1.5rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
        .controls button, .controls input { padding: 0.5rem 1rem; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
        .btn-save { background: #e57373; color: white; }
        .btn-select-all { background: #4a4a6a; color: white; }
        .btn-deselect-all { background: #4a4a6a; color: white; }
        .btn-delete { background: #c62828; color: white; }
        .counter { text-align: center; margin-bottom: 1rem; color: #aaa; font-size: 0.9rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.8rem; }
        .card { position: relative; border-radius: 10px; overflow: hidden; background: #16213e; aspect-ratio: 1; cursor: pointer; border: 3px solid transparent; transition: border-color 0.2s; }
        .card.selected { border-color: #e57373; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card .num { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,0.7); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; }
        .card .check { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .card.selected .check { background: #e57373; }
        .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 0.8rem 1.5rem; border-radius: 12px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .actions { text-align: center; margin-top: 1.5rem; padding-bottom: 2rem; }
        .actions button { padding: 0.7rem 2rem; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; margin: 0 0.5rem; }
    </style>
</head>
<body>
    <h1>&#10024; Arpa's Memories Gallery</h1>
    <div class="counter"><span id="selected-count">0</span> / <span id="total-count">0</span> selected</div>
    <div class="controls">
        <button class="btn-select-all" onclick="selectAll()">Select All</button>
        <button class="btn-deselect-all" onclick="deselectAll()">Deselect All</button>
        <input type="text" id="range-select" placeholder="e.g. 1-10,15,20-25" style="width:200px;color:#000;">
        <button onclick="selectRange()">Select Range</button>
        <button class="btn-delete" onclick="deleteSelected()">&#128465; Delete Selected</button>
        <button class="btn-save" onclick="saveSelection()">&#128190; Save List to File</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="actions">
        <button class="btn-save" onclick="saveSelection()">&#128190; Save Selected List</button>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        const total = 366;
        document.getElementById('total-count').textContent = total;
        const selected = new Set();
        const grid = document.getElementById('grid');

        const indices = Array.from({length: total}, (_, i) => i + 1);
        for (let i = indices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
        }
        indices.forEach(i => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = i;
            card.innerHTML = `
                <img src="assets/arpa_memory_${i}.jpg" alt="Memory ${i}" loading="lazy" onerror="this.parentElement.style.display='none'">
                <span class="num">#${i}</span>
                <span class="check">&#10003;</span>
            `;
            card.addEventListener('click', () => {
                card.classList.toggle('selected');
                if (card.classList.contains('selected')) selected.add(i);
                else selected.delete(i);
                updateCount();
            });
            grid.appendChild(card);
        });

        function updateCount() {
            document.getElementById('selected-count').textContent = selected.size;
        }

        function selectAll() {
            document.querySelectorAll('.card').forEach(c => {
                if (c.style.display !== 'none') {
                    c.classList.add('selected');
                    selected.add(Number(c.dataset.index));
                }
            });
            updateCount();
        }

        function deselectAll() {
            document.querySelectorAll('.card').forEach(c => {
                c.classList.remove('selected');
            });
            selected.clear();
            updateCount();
        }

        function selectRange() {
            const input = document.getElementById('range-select').value.trim();
            if (!input) return;
            const nums = new Set();
            input.split(',').forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    const [a, b] = part.split('-').map(Number);
                    for (let n = a; n <= b; n++) nums.add(n);
                } else {
                    nums.add(Number(part));
                }
            });
            document.querySelectorAll('.card').forEach(c => {
                const n = Number(c.dataset.index);
                if (nums.has(n)) {
                    c.classList.add('selected');
                    selected.add(n);
                }
            });
            updateCount();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function saveSelection() {
            if (selected.size === 0) { showToast('No images selected'); return; }
            const sorted = [...selected].sort((a,b) => a-b);
            const blob = new Blob([sorted.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `arpa_keep_list_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Saved ${sorted.length} image numbers to file`);
        }

        function deleteSelected() {
            if (selected.size === 0) { showToast('No images selected'); return; }
            if (!confirm(`Delete ${selected.size} selected images permanently?\nThis CANNOT be undone.`)) return;
            const sorted = [...selected].sort((a,b) => b-a);
            let deleted = 0;
            sorted.forEach(n => {
                const card = document.querySelector(`.card[data-index="${n}"]`);
                if (card) card.remove();
                selected.delete(n);
            });
            updateCount();
            showToast(`Marked ${sorted.length} images for deletion. Refresh page to reset view.`);
        }
    </script>
</body>
</html>
